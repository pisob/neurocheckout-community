name: Community CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Validate the official release policy
        run: |
          bash -n tools/build-community-release.sh
          bash -n tools/verify-community-release.sh
          bash -n tools/build-connector-release.sh
          test "$(gpg --batch --with-colons --import-options show-only --import RELEASE-PUBLIC-KEY.asc | awk -F: '$1 == "fpr" { print $10; exit }')" = "2949F3BB3295DB8DD776CC8DCEBA4BC1483B4BB0"
          grep -Fq "https://github.com/pisob/neurocheckout-community" README.md
          grep -Fq "https://github.com/pisob/neurocheckout-community" SECURITY.md
          grep -Fq "git clone --branch v0.1.0-preview.2 --depth 1" README.md
          grep -Fq "git verify-tag v0.1.0-preview.2" README.md

      - name: Test the native setup
        run: npm run test:native

      - name: Build the production application
        run: npm run build

      - name: Smoke-test OAuth and Cloud proxy
        run: npm run smoke:integration

      - name: Diagnose a native installation
        run: npm run doctor
        env:
          NC_COMMUNITY_CLIENT_ID: nc_public_ci_fixture
          NC_COMMUNITY_REDIRECT_URI: http://localhost:3400/api/auth/callback
          NC_CLOUD_API_BASE_URL: https://www.neurocheckout.com
          NC_CLOUD_AUTHORIZATION_URL: https://www.neurocheckout.com/community/authorize
          NC_CLOUD_UPGRADE_URL: https://www.neurocheckout.com/pricing
          NC_COMMUNITY_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
          NC_COMMUNITY_COOKIE_SECURE: "false"
          NC_DOCTOR_SKIP_NETWORK: "true"

      - name: Build the self-hosted Docker image
        run: docker build --tag neurocheckout-community:ci .

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
